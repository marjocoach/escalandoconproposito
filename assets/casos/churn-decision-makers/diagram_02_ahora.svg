<text x="460" y="312" font-family="monospace" font-size="10" fill="#9FC4B5" text-anchor="middle">reunión de resultados</text>
<rect x="660" y="270" width="170" height="56" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>
<text x="745" y="294" font-family="monospace" font-size="12" fill="#ECFDF5" text-anchor="middle">CUSTOMER SUCCESS</text>
<text x="745" y="312" font-family="monospace" font-size="10" fill="#9FC4B5" text-anchor="middle">cadencia cada 1–2 meses</text>
