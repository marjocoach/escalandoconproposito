<!-- process boxes -->
<rect x="90" y="270" width="170" height="56" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>
<text x="175" y="294" font-family="monospace" font-size="12" fill="#ECFDF5" text-anchor="middle">VENTAS</text>
<text x="175" y="312" font-family="monospace" font-size="10" fill="#9FC4B5" text-anchor="middle">identifica buyer persona</text>
<rect x="375" y="270" width="170" height="56" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>
