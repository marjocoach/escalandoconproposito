<rect x="680" y="176" width="200" height="30" rx="15" fill="rgba(16,185,129,0.2)" stroke="#10B981" stroke-width="1"/>
<text x="780" y="196" font-family="monospace" font-size="10.5" fill="#ECFDF5" text-anchor="middle">ALERTA: CAMBIO DE DECISOR</text>
<text x="880" y="420" font-family="monospace" font-size="12" letter-spacing="1" fill="#9FC4B5" text-anchor="end">CONTACTO QUE NO SE PIERDE</text>
<line x1="40" y1="450" x2="880" y2="450" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
<text x="40" y="472" font-family="sans-serif" font-size="13" fill="#9FC4B5"><tspan x="40" dy="0">El decisor se identifica desde la venta, se presenta en onboarding y recibe resultados de forma periódica.</tspan><tspan x="40" dy="18">Cualquier cambio de decisor dispara una alerta en el CRM.</tspan></text>
